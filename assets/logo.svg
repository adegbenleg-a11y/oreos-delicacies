<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E03166"/>
      <stop offset="50%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#9C1448"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#FDA4AF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E03166" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(20, 10)" filter="url(#glow)">
    <!-- Outer scalloped / floral circular badge -->
    <circle cx="50" cy="50" r="46" fill="#FFF5F7" stroke="url(#roseGradient)" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#FCE7EB" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Crown / Pastry swirl / Whisk icon -->
    <path d="M50 22 C53 28 58 32 66 33 C61 38 60 44 61 52 C57 48 53 48 50 51 C47 48 43 48 39 52 C40 44 39 38 34 33 C42 32 47 28 50 22 Z" fill="url(#roseGradient)"/>
    
    <!-- Delicate cake tier with candle/spark -->
    <path d="M37 56 C37 54 63 54 63 56 L61 68 C61 71 39 71 39 68 Z" fill="url(#roseGradient)" opacity="0.9"/>
    <path d="M32 70 C32 68 68 68 68 70 L66 80 C66 82 34 82 34 80 Z" fill="url(#roseGradient)"/>
    
    <!-- Sparkles -->
    <circle cx="50" cy="18" r="2.5" fill="#E03166"/>
    <circle cx="28" cy="42" r="1.5" fill="#D81B60"/>
    <circle cx="72" cy="42" r="1.5" fill="#D81B60"/>
  </g>

  <!-- Typography: OREOS DELICACIES -->
  <g transform="translate(135, 30)">
    <!-- Wordmark -->
    <text x="0" y="32" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" letter-spacing="3" fill="#1F2937">
      OREOS
    </text>
    <text x="146" y="32" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="400" letter-spacing="3" fill="url(#roseGradient)">
      DELICACIES
    </text>

    <!-- Tagline & divider -->
    <line x1="2" y1="46" x2="350" y2="46" stroke="#FCE7EB" stroke-width="1.5"/>
    <text x="3" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2" fill="#E03166" text-transform="uppercase">
      Exceptional Cake &amp; Pastries
    </text>
    <circle cx="188" cy="46" r="3" fill="#E03166"/>
  </g>
</svg>
